name: geofence_service
description: This plugin is a geofence service with activity recognition API.
version: 6.0.0+1
homepage: https://github.com/Dev-hwang/geofence_service

environment:
  sdk: ">=2.18.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  geolocator: ^14.0.2
  flutter_foreground_task: ^11.0.3
  activity_recognition_flutter: ^6.1.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.1

flutter:
  plugin:
    platforms:
      android:
        package: com.pravera.geofence_service
        pluginClass: GeofenceServicePlugin
      ios:
        pluginClass: GeofenceServicePlugin
